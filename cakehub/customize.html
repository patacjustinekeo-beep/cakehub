<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222125">
<title>Design your cake | CakeHub Tagbilaran</title><meta name="description" content="CakeHub Tagbilaran: custom birthday, wedding and christening cakes in Tagbilaran City, Bohol. Order online and chat with us.">
<meta property="og:title" content="CakeHub Tagbilaran"><meta property="og:description" content="Baked with love and design with passion."><meta property="og:image" content="/images/banner.webp">
<link rel="icon" href="/images/logo.webp"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="customize"><header id="hd"></header><main><section class="panel nocv"><h1>Design your cake</h1><p>Pick your options on the left. Drag the cake on the right to turn it all the way around.</p>
<div class="designer"><form id="of" class="opts"><div id="opts"></div></form>
<aside class="stage"><div class="stage-in"><canvas id="cv" tabindex="0" aria-label="Live cake preview. Drag, or use the left and right arrow keys, to rotate."></canvas>
<div class="ctl"><label>Rotate 360°<input type="range" id="rot" min="0" max="359" value="29"></label><button type="button" id="auto" class="btn alt sm" aria-pressed="true">Auto-rotate</button></div>
<p class="sum" id="sum"></p><p>Estimated total <span class="total" id="total">₱0</span></p>
<button class="btn" id="send" form="of">Send design to CakeHub</button>
<p class="msg" id="loginhint" hidden><a href="login.html" target="_blank" rel="noopener">Log in</a> (opens a new tab), then press Send again. Your design stays here.</p>
<small>We confirm the final price and details in your chat.</small></div></aside></div></section></main><footer id="ft"></footer><script type="module" src="/js/customize.js"></script></body></html>
