<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8F5EF">
<title>Log in | CakeHub Tagbilaran</title><meta name="description" content="CakeHub Tagbilaran: handcrafted custom cakes, birthday and wedding cakes, cupcakes in Tagbilaran City, Bohol. Order online or design your own.">
<meta property="og:title" content="CakeHub Tagbilaran"><meta property="og:description" content="Baked with love and design with passion."><meta property="og:image" content="/images/banner.webp"><link rel="icon" href="/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="login"><header id="hd"></header><main><section class="wrap narrow sec"><h1>Welcome</h1><div class="tabs" role="tablist"><button data-tab="in" aria-selected="true">Log in</button><button data-tab="up" aria-selected="false">Create account</button></div>
<form id="login"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Log in</button><button class="btn ghost" type="button" id="reset">Forgot password?</button></form>
<form id="signup" hidden><label>Your name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password (6+ characters)<input name="password" type="password" minlength="6" required autocomplete="new-password"></label><button class="btn">Create account</button></form>
<p><button class="btn ghost" type="button" id="google">Continue with Google</button></p><p class="msg" id="msg" role="alert"></p></section></main><footer id="ft"></footer><script type="module" src="/js/login.js"></script></body></html>
