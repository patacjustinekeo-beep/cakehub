<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8F5EF">
<title>Checkout | CakeHub Tagbilaran</title><meta name="description" content="CakeHub Tagbilaran: handcrafted custom cakes, birthday and wedding cakes, cupcakes in Tagbilaran City, Bohol. Order online or design your own.">
<meta property="og:title" content="CakeHub Tagbilaran"><meta property="og:description" content="Baked with love and design with passion."><meta property="og:image" content="/images/banner.webp"><link rel="icon" href="/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body data-page="checkout"><header id="hd"></header><main><section class="wrap pagehead"><span class="eyebrow">Almost There</span><h1>Checkout</h1></section>
<section class="wrap lay" style="padding-bottom:5rem"><form id="cf" novalidate><fieldset><legend>Your details</legend><label>Full name<input name="name" required autocomplete="name"></label><div class="two-f"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Phone number<input name="phone" type="tel" required autocomplete="tel"></label></div></fieldset>
<fieldset><legend>Delivery or pickup</legend><div class="chips"><label class="chip"><input type="radio" name="method" value="Pickup" checked><span>Pickup</span></label><label class="chip"><input type="radio" name="method" value="Delivery"><span>Delivery</span></label></div><label id="addr" hidden>Complete delivery address<textarea name="address" rows="2"></textarea></label><div class="two-f"><label>Preferred date<input name="date" type="date" required></label><label>Preferred time<select name="time"><option>Morning (9am to 12pm)</option><option>Afternoon (12pm to 3pm)</option><option>Late afternoon (3pm to 6pm)</option></select></label></div></fieldset>
<fieldset><legend>Payment method</legend><div id="pays"></div><p class="note">Payments are not processed on this website. You pay using the method you choose, and we confirm your order and total in your chat.</p></fieldset><label>Notes (allergies, message on the cake)<textarea name="notes" rows="3"></textarea></label><p class="msg" id="err" role="alert"></p></form>
<aside class="sumbox"><h3>Order summary</h3><div id="sum"></div><div class="r"><span>Subtotal</span><span id="st"></span></div><div class="r"><span>Delivery fee</span><span id="df"></span></div><div class="r t"><span>Total</span><span id="tt"></span></div><button class="btn" id="place" form="cf" style="width:100%;margin-top:1rem">Place Order</button></aside></section></main><footer id="ft"></footer><script type="module" src="/js/checkout.js"></script></body></html>
