<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222125">
<title>Order | CakeHub Tagbilaran</title><meta name="description" content="CakeHub Tagbilaran: custom birthday, wedding and christening cakes in Tagbilaran City, Bohol. Order online and chat with us.">
<meta property="og:title" content="CakeHub Tagbilaran"><meta property="og:description" content="Baked with love and design with passion."><meta property="og:image" content="/images/banner.webp">

<body data-page="order"><header id="hd"></header><main><section class="panel"><h1>Order a cake</h1><form id="of"><label>Your name<input name="name" required></label><label>Phone number<input name="phone" type="tel" required></label><label>Cake<select name="item"></select></label><label>How many<input name="qty" type="number" min="1" max="50" value="1"></label><label>Date you need it<input name="date" type="date" required></label><label>Pickup or delivery<select name="method"><option>Pickup</option><option>Delivery</option></select></label><label id="addr" hidden>Delivery address<input name="address"></label><label>Notes (theme, name on the cake, allergies)<textarea name="notes" rows="3"></textarea></label><p>Estimated total: <span class="total" id="total">₱0</span><br><small>We confirm the final price in the chat. Delivery fee is not included.</small></p><button class="btn">Send order</button></form></section></main><footer id="ft"></footer><script type="module" src="/js/order.js"></script></body></html>
